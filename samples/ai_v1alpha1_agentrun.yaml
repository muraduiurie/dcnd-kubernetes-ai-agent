# One bounded investigation, created in the workload namespace. This is the
# human path, what `kubectl agent ask` writes: the Service selector scenario
# is invisible to the cluster's own health signals, so nobody is paged for it.
#
# Spec is the intent. Everything the runtime learns goes into status: the
# diagnosis, the evidence it cited, the typed actions it proposes, and what
# the operator did with them.
apiVersion: ai.dncp.io/v1alpha1
kind: AgentRun
metadata:
  name: investigate-checkout
  namespace: checkout
spec:
  agentRef:
    name: incident-investigator

  # Untrusted input. It goes into the user message, never the system prompt.
  objective: >-
    Investigate why the checkout service returns no responses even though
    every checkout pod is running and ready.

  remediation:
    # propose: the operator waits for an approval on every action.
    # auto: it applies immediately, except types the agent policy holds back.
    mode: propose

  # How long the run may sit in AwaitingApproval before it fails.
  approvalTimeout: 1h

  # Approvals are written by a human after reading status.proposedActions,
  # normally through `kubectl agent approve`. Each one names an action id and
  # the digest the operator computed for it; the operator recomputes the
  # digest before applying and refuses on mismatch, so a proposal cannot be
  # rewritten after someone approved it.
  #
  # approvals:
  #   - actionID: fix-selector
  #     digest: sha256:3f1c8e5b2a7d4c9f0e1b6a8d3c5f7e9b2d4a6c8e0f1b3d5a7c9e1f3b5d7a9c1e

  # A human can end the run without applying anything, which is what
  # `kubectl agent reject` writes.
  #
  # decision:
  #   declined: true
  #   reason: Rolling back by hand, the selector change was intentional.
